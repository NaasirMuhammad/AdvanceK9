name: Build AdvancedK9 v0.23.1-beta
# Produces the verified Windows release artifacts.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, codex/advancedk9-v0.23.1-beta ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build AdvancedK9 main plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.1-beta
          path: bin/**/AdvancedK9.dll
          if-no-files-found: error
      - name: Build AdvancedK9 compatibility bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Bridge/LspdfrApiShim/LspdfrApiShim.csproj
          dotnet build Bridge/LspdfrApiShim/LspdfrApiShim.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/shim
          dotnet restore AdvancedK9.LSPDFRBridge.csproj
          dotnet build AdvancedK9.LSPDFRBridge.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:OutputPath="$pwd/artifact-bridge/"
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.1-beta-bridge
          path: artifact-bridge/AdvancedK9.LSPDFRBridge.dll
          if-no-files-found: error
      - name: Verify and package corrected v0.23.1 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Get-ChildItem 'bin' -Recurse -Filter 'AdvancedK9.dll' | Select-Object -First 1
          $bridge = Resolve-Path 'artifact-bridge/AdvancedK9.LSPDFRBridge.dll'
          $lemon = Get-ChildItem 'bin' -Recurse -Filter 'LemonUI.RagePluginHook.dll' | Select-Object -First 1
          if (-not $main) { throw 'Compiled AdvancedK9.dll was not found.' }
          if (-not $lemon) { throw 'LemonUI.RagePluginHook.dll was not found.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($main.FullName).Version -ne [Version]'0.23.1.0') { throw 'AdvancedK9.dll version is not 0.23.1.0.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($bridge).Version -ne [Version]'0.23.1.0') { throw 'AdvancedK9.LSPDFRBridge.dll version is not 0.23.1.0.' }
          $package = Join-Path $pwd 'release-package'
          $pluginRoot = Join-Path $package 'Plugins'
          $lspdfrRoot = Join-Path $pluginRoot 'LSPDFR'
          $configRoot = Join-Path $lspdfrRoot 'AdvancedK9'
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          Copy-Item $main.FullName (Join-Path $pluginRoot 'AdvancedK9.dll')
          Copy-Item $bridge (Join-Path $lspdfrRoot 'AdvancedK9.LSPDFRBridge.dll')
          Copy-Item $lemon.FullName (Join-Path $package 'LemonUI.RagePluginHook.dll')
          Copy-Item 'Config/AdvancedK9.ini' (Join-Path $configRoot 'AdvancedK9.default.ini')
          Copy-Item 'Config/AcademyCourses.json','Config/CompatibilityPresets.json' $configRoot
          Copy-Item 'Config/Portraits' $configRoot -Recurse
          Copy-Item 'INSTALL.txt','README.md','CHANGELOG.md','LICENSE' $package
          $forbidden = Get-ChildItem $package -Recurse -File | Where-Object {
            $_.Name -match '^(NAudio|Microsoft\.Win32\.Registry|System\.Security).*\.dll$' -or
            $_.FullName -match '(?i)(Policing.?Redefined|CommonDataFramework|NexusMDT|NPCI|Stop.?The.?Ped)'
          }
          if ($forbidden) { throw "Forbidden release content: $($forbidden.FullName -join ', ')" }
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $pwd 'AdvancedK9-v0.23.1-beta-voice-fix.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.1-beta-voice-fix-release
          path: AdvancedK9-v0.23.1-beta-voice-fix.zip
          if-no-files-found: error
