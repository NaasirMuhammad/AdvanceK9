name: Build AdvancedK9 v1.6
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/advancedk9-v1.6 ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and compile source
        shell: pwsh
        run: |
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - name: Verify new v1.6 assembly and compiled systems
        shell: pwsh
        run: |
          $dll = Resolve-Path 'bin/Release/net48/AdvancedK9.dll'
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($dll).Version
          if ($version.Major -ne 1 -or $version.Minor -ne 6) { throw "Expected v1.6 assembly, got $version" }
          $stale = '0b4a652673cc9a7237b5473c4c0854a702007da5c32e25042d810f263d8a190c'
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -eq $stale) { throw 'Build produced the stale uploaded v1.5 DLL.' }
          dotnet tool install --global ilspycmd
          ilspycmd $dll -o verified-source
          $compiled = Get-ChildItem verified-source -Recurse -File | Get-Content -Raw
          foreach ($marker in @('CommandRegistry','StartContinuous','NextEquipmentTexture','FirstAid','MoveHud','EnterVehicle','TrainingXp')) {
            if ($compiled -notmatch [regex]::Escape($marker)) { throw "Missing compiled v1.6 marker: $marker" }
          }
          "AssemblyVersion=$version`nSHA256=$hash`nBuiltUtc=$([DateTime]::UtcNow.ToString('o'))" | Set-Content build-verification.txt
      - name: Create drag-and-drop package
        shell: pwsh
        run: |
          $root = 'package/Plugins/LSPDFR'
          New-Item -ItemType Directory -Force "$root/AdvancedK9" | Out-Null
          Copy-Item 'bin/Release/net48/AdvancedK9.dll' $root
          Copy-Item 'Config/AdvancedK9.ini','Config/AcademyCourses.json','Config/CompatibilityPresets.json' "$root/AdvancedK9"
          Copy-Item 'INSTALL.txt','CHANGELOG.md','build-verification.txt' package
          $forbidden = Get-ChildItem package -Recurse -File | Where-Object { $_.Name -match '^(NAudio|Microsoft\.Win32\.Registry|System\.Security).*\.dll$' }
          if ($forbidden) { throw "Forbidden dependency DLL bundled: $($forbidden.Name -join ', ')" }
          Compress-Archive -Path 'package/*' -DestinationPath 'AdvancedK9-v1.6.0-DragAndDrop.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v1.6.0-DragAndDrop
          path: AdvancedK9-v1.6.0-DragAndDrop.zip
          if-no-files-found: error
