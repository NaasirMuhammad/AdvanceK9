name: Build AdvancedK9 v0.24.0-beta
# Produces the verified Windows release artifacts.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, codex/advancedk9-v0.23.1-beta, codex/advancedk9-next-beta ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build AdvancedK9 main plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.24.0-beta-core
          path: bin/**/AdvancedK9.dll
          if-no-files-found: error
      - name: Build AdvancedK9 compatibility bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Bridge/LspdfrApiShim/LspdfrApiShim.csproj
          dotnet build Bridge/LspdfrApiShim/LspdfrApiShim.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/shim
          dotnet restore AdvancedK9.LSPDFRBridge.csproj
          dotnet build AdvancedK9.LSPDFRBridge.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:OutputPath="$pwd/artifact-bridge/"
      - name: Build AdvancedK9 callout expansion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore AdvancedK9.Callouts.csproj
          dotnet build AdvancedK9.Callouts.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/callouts
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.24.0-beta-callouts
          path: build/callouts/AdvancedK9.Callouts.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.24.0-beta-bridge
          path: artifact-bridge/AdvancedK9.LSPDFRBridge.dll
          if-no-files-found: error
      - name: Verify and package direct-install release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Get-ChildItem 'bin' -Recurse -Filter 'AdvancedK9.dll' | Select-Object -First 1
          $bridge = Resolve-Path 'artifact-bridge/AdvancedK9.LSPDFRBridge.dll'
          $callouts = Resolve-Path 'build/callouts/AdvancedK9.Callouts.dll'
          $api = Get-ChildItem 'bin' -Recurse -Filter 'AdvancedK9.API.dll' | Select-Object -First 1
          $lemon = Get-ChildItem 'bin' -Recurse -Filter 'LemonUI.RagePluginHook.dll' | Select-Object -First 1
          $naudioCore = Get-ChildItem 'bin' -Recurse -Filter 'NAudio.Core.dll' | Select-Object -First 1
          $naudioWinMM = Get-ChildItem 'bin' -Recurse -Filter 'NAudio.WinMM.dll' | Select-Object -First 1
          if (-not $main) { throw 'Compiled AdvancedK9.dll was not found.' }
          if (-not $callouts) { throw 'Compiled AdvancedK9.Callouts.dll was not found.' }
          if (-not $api) { throw 'Compiled AdvancedK9.API.dll was not found.' }
          if (-not $lemon) { throw 'LemonUI.RagePluginHook.dll was not found.' }
          if (-not $naudioCore) { throw 'Required AI voice runtime NAudio.Core.dll was not found.' }
          if (-not $naudioWinMM) { throw 'Required AI voice runtime NAudio.WinMM.dll was not found.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($main.FullName).Version -ne [Version]'0.24.0.6') { throw 'AdvancedK9.dll version is not 0.24.0.6.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($api.FullName).Version -ne [Version]'0.24.0.0') { throw 'AdvancedK9.API.dll version is not 0.24.0.0.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($bridge).Version -ne [Version]'0.24.0.0') { throw 'AdvancedK9.LSPDFRBridge.dll version is not 0.24.0.0.' }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($callouts).Version -ne [Version]'0.24.0.14') { throw 'AdvancedK9.Callouts.dll version is not 0.24.0.14.' }
          $package = Join-Path $pwd 'release-package'
          $pluginRoot = Join-Path $package 'Plugins'
          $lspdfrRoot = Join-Path $pluginRoot 'LSPDFR'
          $configRoot = Join-Path $lspdfrRoot 'AdvancedK9'
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          Copy-Item $main.FullName (Join-Path $pluginRoot 'AdvancedK9.dll')
          Copy-Item $api.FullName (Join-Path $configRoot 'AdvancedK9.API.dll')
          Copy-Item $bridge (Join-Path $lspdfrRoot 'AdvancedK9.LSPDFRBridge.dll')
          if (Test-Path (Join-Path $pluginRoot 'AdvancedK9.API.dll')) { throw 'AdvancedK9.API.dll must not be placed in Plugins root because RPH will try to execute it as a plugin.' }
          if (Test-Path (Join-Path $lspdfrRoot 'AdvancedK9.API.dll')) { throw 'AdvancedK9.API.dll must not be placed in the LSPDFR scan root because ForceDuty opens every assembly there.' }
          Copy-Item $callouts (Join-Path $lspdfrRoot 'AdvancedK9.Callouts.dll')
          Copy-Item $lemon.FullName (Join-Path $package 'LemonUI.RagePluginHook.dll')
          Copy-Item $naudioCore.FullName (Join-Path $package 'NAudio.Core.dll')
          Copy-Item $naudioWinMM.FullName (Join-Path $package 'NAudio.WinMM.dll')
          Copy-Item 'Config/AdvancedK9.ini' (Join-Path $configRoot 'AdvancedK9.default.ini')
          Copy-Item 'Config/AcademyCourses.json','Config/CompatibilityPresets.json' $configRoot
          Copy-Item 'Config/Portraits' $configRoot -Recurse
          Copy-Item 'INSTALL.txt','README.md','CHANGELOG.md','LICENSE','THIRD_PARTY_NOTICES.md' $package
          $forbidden = Get-ChildItem $package -Recurse -File | Where-Object {
            $_.Name -match '^(Microsoft\.Win32\.Registry|System\.Security).*\.dll$' -or
            $_.FullName -match '(?i)(Policing.?Redefined|CommonDataFramework|NexusMDT|NPCI|Stop.?The.?Ped)'
          }
          if ($forbidden) { throw "Forbidden release content: $($forbidden.FullName -join ', ')" }
          $requiredVoiceRuntime = @(
            (Join-Path $package 'NAudio.Core.dll'),
            (Join-Path $package 'NAudio.WinMM.dll')
          )
          foreach ($runtimeFile in $requiredVoiceRuntime) {
            if (-not (Test-Path $runtimeFile)) { throw "Release is missing required AI voice runtime: $runtimeFile" }
            if ([System.Reflection.AssemblyName]::GetAssemblyName($runtimeFile).Version -ne [Version]'2.2.1.0') {
              throw "Unexpected AI voice runtime version: $runtimeFile"
            }
          }
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $pwd 'AdvancedK9-v0.24.0-beta.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.24.0-beta-release
          path: AdvancedK9-v0.24.0-beta.zip
          if-no-files-found: error
