name: Build AdvancedK9 v0.23.0-beta
# Produces the verified Windows drag-and-drop artifact.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, codex/advancedk9-v0.23.0-beta ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and compile source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/main
          dotnet restore Bridge/LspdfrApiShim/LspdfrApiShim.csproj
          dotnet build Bridge/LspdfrApiShim/LspdfrApiShim.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/shim
          dotnet restore AdvancedK9.LSPDFRBridge.csproj
          dotnet build AdvancedK9.LSPDFRBridge.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.0-beta
          path: |
            build/main/AdvancedK9.dll
            build/main/LemonUI.RagePluginHook.dll
            build/bridge/AdvancedK9.LSPDFRBridge.dll
          if-no-files-found: error
