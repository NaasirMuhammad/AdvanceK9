name: Build AdvancedK9 v0.23.0-beta
# Produces the verified Windows drag-and-drop artifact.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, codex/advancedk9-v0.23.0-beta ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and compile source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifact-bin | Out-Null
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
          $mainDll = Get-ChildItem bin -Recurse -Filter 'AdvancedK9.dll' | Select-Object -First 1
          if (-not $mainDll) { throw 'AdvancedK9.dll was not emitted by the Windows build.' }
          Copy-Item $mainDll.FullName artifact-bin
          dotnet restore Bridge/LspdfrApiShim/LspdfrApiShim.csproj
          dotnet build Bridge/LspdfrApiShim/LspdfrApiShim.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/shim
          dotnet restore AdvancedK9.LSPDFRBridge.csproj
          dotnet build AdvancedK9.LSPDFRBridge.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:OutputPath="$pwd/artifact-bridge/"
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.0-beta
          path: |
            artifact-bin/AdvancedK9.dll
            artifact-bridge/AdvancedK9.LSPDFRBridge.dll
          if-no-files-found: error
