name: Build AdvancedK9 v0.23.1-beta
# Produces the verified Windows release artifacts.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, codex/advancedk9-v0.23.1-beta, codex/advancedk9-next-beta ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build AdvancedK9 main plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore AdvancedK9.csproj
          dotnet build AdvancedK9.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.1-beta
          path: bin/**/AdvancedK9.dll
          if-no-files-found: error
      - name: Build AdvancedK9 compatibility bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Bridge/LspdfrApiShim/LspdfrApiShim.csproj
          dotnet build Bridge/LspdfrApiShim/LspdfrApiShim.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true -o build/shim
          dotnet restore AdvancedK9.LSPDFRBridge.csproj
          dotnet build AdvancedK9.LSPDFRBridge.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:OutputPath="$pwd/artifact-bridge/"
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedK9-v0.23.1-beta-bridge
          path: artifact-bridge/AdvancedK9.LSPDFRBridge.dll
          if-no-files-found: error
