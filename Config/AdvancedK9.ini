[Keys]
; Hold Modifier and press SpawnDismiss to create/dismiss the dog.
SpawnDismiss=K
Modifier=LControlKey
CommandWheel=J
DogCamera=C
Leash=L
PushToTalk=V
KennelProfile=U

[Voice]
Enabled=true
; Voice is push-to-talk only. Hold V while speaking; ambient audio is ignored.
ContinuousListening=false
; Provider may be Groq or OpenAI.
Provider=Groq
Model=whisper-large-v3-turbo
Language=en
; Paste the Groq or OpenAI API key after ApiKey=. It is never displayed or logged.
ApiKey=
; Optional fallback when ApiKey above is blank.
ApiKeyEnvironmentVariable=GROQ_API_KEY

[Dog]
Name=Rex
Breed=German Shepherd
; Used when the kennel vest choice is Custom. Supports add-on vested K9 models.
CustomModel=
CoatVariation=0
; 0=None, 1=Police, 2=BCSO/Sheriff, 3=Trooper, 4=Fire, 5=Off-duty,
; 6=Service, 7=Medic, 8=Black, 9=Blue, 10=High Visibility, 11=Custom
VestStyle=1
VestColor=0
; -1 detects the model's clothing component. Override for a specific add-on model.
VestComponent=-1

[Search]
; Used only if Policing Redefined does not expose a result for the target.
FallbackPositiveChance=0.28
Radius=12.0

[Tracking]
AcquisitionRadius=80.0

[Compatibility]
; Auto selects Policing Redefined/CDF first, then Stop The Ped, otherwise standalone.
; Valid values: Auto, PolicingRedefined, StopThePed, Standalone
Mode=Auto
; Prefer the active PR/STP traffic-stop vehicle or interaction ped for searches.
UseActiveTargets=true
; Best-effort sharing of K9 indications, located suspects and apprehensions when an API is exposed.
ShareK9Results=true
; Reject cuffed, arrested, kneeling, surrendering or transported peds from apprehension.
ProtectRestrainedPeds=true

[Fetch]
; Head-bone local mouth position. Adjust in 0.01 steps for custom dog models.
BallOffsetX=0.12
BallOffsetY=0.01
BallOffsetZ=-0.025

[Apprehension]
; Dog disengages before the target can be killed.
HealthFloor=35
; Apprehension requires the handler to be aiming a firearm or taser at the suspect.
RequireWeaponAim=true

[Vehicle]
; Rear-seat bone offsets. Y moves toward the rear; Z raises the dog from the floor.
; Adjust in 0.05 steps only when a custom vehicle has unusually placed seat bones.
SeatOffsetX=0.00
SeatOffsetY=-0.38
SeatOffsetZ=0.42

[Trust]
; Used only when no saved trust.dat exists. Range: 0-100.
StartingLevel=40
