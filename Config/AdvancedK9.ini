[Keys]
; Hold Modifier and press SpawnDismiss to create/dismiss the dog.
SpawnDismiss=K
Modifier=LControlKey
CommandWheel=J
DogCamera=C
Leash=L
PushToTalk=V
KennelProfile=U

[Voice]
Enabled=true
; Live microphone/VAD mode. No hold-V recording is required.
ContinuousListening=true
; Provider may be Groq or OpenAI.
Provider=Groq
Model=whisper-large-v3-turbo
Language=en
; Paste the Groq or OpenAI API key after ApiKey=. It is never displayed or logged.
ApiKey=
; Optional fallback when ApiKey above is blank.
ApiKeyEnvironmentVariable=GROQ_API_KEY

[Dog]
Name=Rex
Breed=German Shepherd
; Used when the kennel vest choice is Custom. Supports add-on vested K9 models.
CustomModel=
CoatVariation=0
; 0=None, 1=Police, 2=BCSO/Sheriff, 3=Trooper, 4=Fire, 5=Off-duty,
; 6=Service, 7=Medic, 8=Black, 9=Blue, 10=High Visibility, 11=Custom
VestStyle=1
VestColor=0
; -1 detects the model's clothing component. Override for a specific add-on model.
VestComponent=-1

[Search]
; Used only if Policing Redefined does not expose a result for the target.
FallbackPositiveChance=0.28
Radius=12.0

[Tracking]
AcquisitionRadius=80.0

[Fetch]
; Head-bone local mouth position. Adjust in 0.01 steps for custom dog models.
BallOffsetX=0.12
BallOffsetY=0.01
BallOffsetZ=-0.025

[Apprehension]
; Dog disengages before the target can be killed.
HealthFloor=35

[Trust]
; Used only when no saved trust.dat exists. Range: 0-100.
StartingLevel=40
